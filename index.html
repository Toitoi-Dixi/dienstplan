<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dienstplan V_2027</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="header">
        Dienstplan V_2027
    </div>

    <div class="toolbar">

        <label>Von:</label>
        <input type="date" id="von">

        <label>Bis:</label>
        <input type="date" id="bis">

        <button onclick="ladePlan()">
           Dienstplan Laden
        </button>
    </div>

   <div class="layout">

    <div class="menu">

        <h3>Menü</h3>

      
         <button onclick="fahrerInfo()">
            + Fahrer Info
        </button>
        <button onclick="fahrerInaktivSetzen()">
            Fahrer inaktiv setzen
        </button>
        <hr>
          <button onclick="fuhrpark()">
            🚚 Fuhrpark
               <hr>
        </button>
 <button onclick="fahrzeugAnlegen()">
            + Fahrzeug anlegen
        </button>
         <button onclick="fahrzeugLoeschen()">
            Fahrzeug löschen
        </button>
        <hr>
        <button onclick="administration()">
            ⚙ Admin
                    <hr>
        </button>
  <button onclick="fahrerHinzufuegen()">
            + Fahrer anlegen
        </button>
         <button onclick="dienstAnlegen()">
            + Dienst anlegen
        </button>
         <button onclick="dienstLoeschen()">
            Dienst löschen
        </button>
    </div>

    <div class="planbereich">

        <table>
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
        </table>

    </div>

    <div class="sidebar">

        <h3>Offene Dienste</h3>

        <div id="offeneDienste"></div>

    </div>

</div>

    </div>

    <!-- Modal -->

    <div id="modalOverlay" class="modalOverlay">

        <div class="modal">

            <h2>Planung bearbeiten</h2>

            <label>Art</label>

            <select id="artInput" onchange="artGeaendert()">
              
            </select>

            <div id="dienstBlock">

                <label>Dienst</label>

                <select id="dienstInput">
       
                </select>

                <label>Fahrzeug</label>

                <select id="fahrzeugInput">
                 
                </select>

            </div>

            <div class="modalButtons">

                <button onclick="speichernZelle()">
                    Speichern
                </button>

                <button onclick="schliessenModal()">
                    Abbrechen
                </button>

            </div>

        </div>

    </div>
    <div id="fahrerInfoOverlay" class="modalOverlay">

<div class="modal">

<h2>Fahrerinfo</h2>
<select id="fahrerInfoSelect"
        onchange="aktualisiereFahrerInfo()">
</select>
<div id="fahrerInfoDaten">
</div>

<div class="modalButtons">

<button onclick="schliesseFahrerInfo()">
Schließen
</button>

</div>

</div>

</div>
    <div id="fahrerNeuOverlay"
        class="modalOverlay">
        <div class="modal">
            <h2>Fahrer anlegen</h2>
            <label>Nachname</label>
            <input
                type="text"
                id="neuFamilienname">
            <label>Vorname</label>
            <input
                type="text"
                id="neuVorname">
    <label>Chip</label>

    <input
        type= "text"
        id="neuChip">
    <div class="modalButtons">
        <button
            onclick="fahrerSpeichern()">
            Speichern
        </button>
        <button
            onclick="schliesseNeuenFahrer()">
            Abbrechen
        </button>
    </div>
</div>
</div>
    <div id="meldung"></div>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>

<script src="script.js"></script>

</body>
</html>
